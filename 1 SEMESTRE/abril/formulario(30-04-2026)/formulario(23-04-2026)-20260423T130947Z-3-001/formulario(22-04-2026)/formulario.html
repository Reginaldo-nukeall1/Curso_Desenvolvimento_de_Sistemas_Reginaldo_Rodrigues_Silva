<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Cadastro de Devs</title>
        <link rel="stylesheet" href="teacher.css">
    </head>
    <body>
        <div>
            <h1 id="titulo">Cadastro de DEVs</h1>
            <p id="subtitulo"><u><strong> Complete suas informações</strong></u></p>
            <br> 
        </div>
        <form>
            <fieldset class="grupo">
                <div class="campo">
                    <label for="nome"><strong>Nome</strong></label>
                    <input type="text" name="nome" id="nome" required>
                </div>
                
                <div class="campo">
                    <label for="sobrenome"><strong>sobrenome</strong></label>
                    <input type="text" nickname="sobrenome" id="sobrenome" required>
                </div>
            </fieldset>
        
            <div class="campo">
                <label for="email"><strong>Email</strong></label>
                <input type="text" gmail="email" id="email" required>
            </div>
            
            <div class="campo">
                <label>você é qual tipo de programador?</label> <br>

                <label>
                    <input type="radio" name="devweb" name="job_type" value="front" checked>Frontend</label>

                <label>
                    <input type="radio"name="devweb" name="job_type" value="back">Backend
                </label>
                <label>
                    <input type="radio" name="devweb" name="job_type" value="full">Fullstack    
                </label>    
            </div>

            <div class="campo">
                <label for="senioriodade"><strong>senioriodade</strong></label>
                <select id="senioriodade" required>
                    <option selected disabled value="">selecione</option>
                    <option>Junior</option>
                    <option>Senior</option>
                    <option>Pleno</option>
                </select>
            </div>

            <fieldset class="grupo">
                <div id="check">
                    <label><strong>Selecione as técnologias que utiliza:</strong></label> <br> <br>
                    <input type="checkbox" id="type_coding1" name="type_coding1" value="HTML">
                    <label for="type_coding1">HTML</label>
                    <input type="checkbox" id="type_coding2" name="type_coding2" value="CSS">
                    <label for="type_coding2">CSS</label>
                    <input type="checkbox" id="type_coding3" name="type_coding3" value="JavaScript">
                    <label for="type_coding3">JavaScript</label>
                    <input type="checkbox" id="type_coding4" name="type_coding4" value="PHP">
                    <label for="type_coding4">PHP</label>
                    <input type="checkbox" id="type_coding5" name="type_coding5" value="C#">
                    <label for="type_coding5">C#</label>
                    <input type="checkbox" id="type_coding6" name="type_coding5" value="python">
                    <label for="type_coding6">python</label>
                    <input type="checkbox" id="type_coding7" name="type_coding5" value="Java">
                    <label for="type_coding7">Java</label>
                </div> 
            </fieldset>

            <div class="campo">
                <br>
                <label for="experiencia"><strong>Conte um pouco mais de sua experiência:</strong></label> <br>
                <textarea rows="6" maxlength="67" style="width: 26em" name="experiencia"></textarea>
            </div>   
            
            <button class="botao" type="submit" onsubmit="">Concluído</button>
        
        </form>
    </body>
    </html>
